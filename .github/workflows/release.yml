name: Release

on:
  push:
    tags:
      - "v*"

# Annotated tag pushes have delivered two push events one second apart for the
# same ref (v0.19.2 runs 34920496061 and 34920497098). Cancel the duplicate so
# only one run publishes. The apt-publish group on the publish job is unchanged
# and still serializes against the republish workflow without cancelling it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  # Read-only: the run checks that the Pages site still serves gh-pages, but
  # cannot change it. See scripts/verify-pages.sh.
  pages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

  build-darwin:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate full changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Build macOS release binaries
        run: make release

      - name: Verify macOS tarballs contain a runnable cloister
        run: |
          set -euo pipefail
          VERSION=$(make -s print-version)
          HOST_ARCH=$(uname -m)
          for ARCH in arm64 amd64; do
            TAR="dist/cloister_${VERSION}_darwin_${ARCH}.tar.gz"
            test -f "$TAR"
            tar -tzf "$TAR" | grep -Eq '(^|/)cloister$'
            tmp=$(mktemp)
            tar -xOzf "$TAR" ./cloister > "$tmp"
            chmod +x "$tmp"
            if [ "$ARCH" = amd64 ] && [ "$HOST_ARCH" = arm64 ]; then
              out=$(arch -x86_64 "$tmp" version)
            else
              out=$("$tmp" version)
            fi
            echo "$TAR -> $out"
            echo "$out" | grep -F "$VERSION"
            rm -f "$tmp"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-tarballs
          path: dist/*.tar.gz
          if-no-files-found: error

  build-linux-vm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build cloister-vm binaries
        run: make release-vm

      - name: Build cloister-vm .deb packages
        run: |
          VERSION=$(make -s print-version)
          scripts/build-deb-vm.sh "$VERSION" dist dist/deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-debs
          path: dist/deb/*.deb
          if-no-files-found: error

  release:
    needs: [build-darwin, build-linux-vm]
    runs-on: ubuntu-latest
    # Serialized against the republish workflow. Both extend the same gh-pages
    # branch by cloning it, adding packages, and pushing; overlapping runs would
    # race and the loser's push would be rejected part-way through a release.
    concurrency:
      group: apt-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - uses: actions/download-artifact@v4
        with:
          name: darwin-tarballs
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: linux-debs
          path: dist/deb

      - name: Guard release archives contain an executable cloister
        run: |
          set -euo pipefail
          VERSION=$(make -s print-version)
          for ARCH in arm64 amd64; do
            TAR="dist/cloister_${VERSION}_darwin_${ARCH}.tar.gz"
            test -f "$TAR"
            tar -tzf "$TAR" | grep -Eq '(^|/)cloister$'
            mode=$(tar -tvzf "$TAR" | awk '$NF ~ /(^|\/)cloister$/ { print $1; exit }')
            echo "$TAR mode=$mode"
            echo "$mode" | grep -q 'x'
          done
          test -n "$(ls dist/deb/*.deb 2>/dev/null)"

      # The release is created before the APT repository is published, so the
      # .deb packages reach durable storage before the step most likely to fail
      # runs. If publishing then breaks, the packages still exist and the
      # "Republish APT repository" workflow can rebuild the repository from
      # them; the reverse order leaves a broken repository whose only fix is
      # another tag.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PRERELEASE_FLAG=""
          if echo "$TAG_NAME" | grep -qE '(alpha|beta|rc)'; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # The .deb packages are attached alongside the macOS tarballs so that
          # the gh-pages branch stops being the only copy of them. That is what
          # makes the published repository rebuildable without cutting a
          # release.
          gh release create "$TAG_NAME" dist/*.tar.gz dist/deb/*.deb \
            --title "$TAG_NAME" \
            --notes-file RELEASE_NOTES.md \
            $PRERELEASE_FLAG

      - name: Import the APT signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          # VMs add this repository with signed-by=, so unsigned metadata is
          # not a degraded repository — apt refuses it outright and every
          # provision fails. A missing key stops the run here rather than
          # publishing something no VM can install from.
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::APT_GPG_PRIVATE_KEY is not set; refusing to publish unsigned repository metadata"
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Assemble the APT repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          # The published pool is extended rather than rebuilt from this one
          # version, so previously released cloister-vm packages stay
          # installable and the branch keeps a history to inspect or revert.
          #
          # Tested with a command substitution rather than `ls-remote | grep -q`
          # because the pipeline's exit status depends on the shell's pipefail
          # setting: grep -q closes the pipe on its first match, ls-remote dies
          # of SIGPIPE, and under pipefail the test reads as false. That would
          # take the else branch and re-initialize gh-pages as an orphan,
          # discarding the whole accumulated pool.
          if [ -n "$(git ls-remote --heads origin gh-pages)" ]; then
            git clone --branch gh-pages --single-branch \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/apt-repo
          else
            mkdir -p /tmp/apt-repo
            git -C /tmp/apt-repo init -b gh-pages
          fi

          mkdir -p /tmp/apt-repo/pool
          cp dist/deb/*.deb /tmp/apt-repo/pool/

          # Recover anything the branch is missing from the releases, so a
          # release also repairs a pool that was truncated or lost since the
          # last one.
          scripts/sync-release-packages.sh /tmp/apt-repo "$GITHUB_REPOSITORY"

          scripts/build-apt-repo.sh /tmp/apt-repo

      - name: Verify the generated APT repository
        run: scripts/verify-apt-repo.sh /tmp/apt-repo

      - name: Publish the APT repository to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(make -s print-version)
          cd /tmp/apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update APT repository for ${VERSION}"
          # A plain push, not --force: a rejected push now means another
          # publisher advanced the branch, and overwriting it would discard
          # whatever packages that run added.
          if git remote get-url origin >/dev/null 2>&1; then
            git push origin gh-pages
          else
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push -u origin gh-pages
          fi

      - name: Verify the Pages site serves gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/verify-pages.sh "$GITHUB_REPOSITORY"

      - name: Update Homebrew formula
        if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(make -s print-version)
          SHA_DARWIN_ARM64=$(sha256sum "dist/cloister_${VERSION}_darwin_arm64.tar.gz" | cut -d' ' -f1)
          SHA_DARWIN_AMD64=$(sha256sum "dist/cloister_${VERSION}_darwin_amd64.tar.gz" | cut -d' ' -f1)

          cat > /tmp/cloister.rb <<FORMULA_EOF
          class Cloister < Formula
            desc "Isolated VM environments for AI coding agents and multi-account separation"
            homepage "https://github.com/ekovshilovsky/cloister"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/ekovshilovsky/cloister/releases/download/v${VERSION}/cloister_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "https://github.com/ekovshilovsky/cloister/releases/download/v${VERSION}/cloister_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            def install
              bin.install "cloister"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/cloister version")
            end
          end
          FORMULA_EOF

          git clone "https://x-access-token:${GH_TOKEN}@github.com/ekovshilovsky/homebrew-tap.git" /tmp/homebrew-tap
          cp /tmp/cloister.rb /tmp/homebrew-tap/Formula/cloister.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cloister.rb
          git diff --cached --quiet || git commit -m "Update cloister to ${VERSION}"
          git push
